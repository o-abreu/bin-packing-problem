# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
# gurobi (pkgs.gurobi) é unfree; devenv 2.x só expõe isso em nixpkgs.allow_unfree
nixpkgs:
  allow_unfree: true

inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  nixpkgs-quarto:
    # pinned nixpkgs rev carrying quarto 1.6.43 — the dfolio/quarto-ieee
    # journal extension is rejected by quarto >= 1.9 (schema changes), while
    # the 1.5.x series is broken on modern nixpkgs (needs deno 1.x); 1.6
    # works with the deno 2 runtime nixpkgs provides
    url: github:NixOS/nixpkgs/b5dd9efc912ecabeafa4f082d31e19cb1c74266c
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs-python:
    url: github:cachix/nixpkgs-python
    inputs:
      nixpkgs:
        follows: nixpkgs
