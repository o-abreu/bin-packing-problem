# typos não tem locale pt-BR (só variantes de inglês: en/en-us/en-gb/...);
# num repo de prosa pt-BR, as palavras portuguesas entram como allowlist
# global — inclusive as que vazam para comentários/citações em arquivos
# ingleses (ex.: "ser" em trechos citados). Ressalva: isso também mascara
# um erro inglês real ("set" digitado "ser").
[default]
locale = "en"

[files]
extend-exclude = [
  "report/_extensions", # IEEEtran vendido: typos upstream e abreviações (Commun, Comput)
]

